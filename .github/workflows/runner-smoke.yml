name: Runner availability diagnostic
on:
  push:
    paths:
      - .github/workflows/runner-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Confirm GitHub runner started
        shell: bash
        run: |
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "GITHUB_SHA=$GITHUB_SHA"
