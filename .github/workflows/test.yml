name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SourceRevisionId: ${{ github.sha }}
concurrency:
  group: benchforge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Archive source snapshot for local documentation audit
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: benchforge-xdoc-source
          path: |
            src/
            tools/
            scripts/
            tests/
            examples/
            generated/
            docs/api-documentation-baseline.json
          retention-days: 7
          if-no-files-found: error

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StrictDoc requirements tracker
        run: python -m pip install -r tools/requirements.txt
      - name: Cache complete check workflow
        uses: actions/cache@v4
        with:
          path: .tools/check-workflow
          key: check-workflow-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/BenchForge.CheckWorkflow/*', 'tools/BenchForge.Checks/*.cs', 'tools/BenchForge.Checks/scoreboard.html', 'tools/BenchForge.DocumentationAudit/RoslynAudit.cs', 'scripts/python_ast_inventory.py', 'global.json', 'Directory.Build.*', 'Directory.Packages.props') }}
      - name: Run complete check and report workflow
        shell: pwsh
        run: ./scripts/checks.ps1 -Python python
      - name: Archive source-reference audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-reference-audit-${{ matrix.os }}
          path: build/source-neutrality-audit.json
          if-no-files-found: ignore
      - name: Parse and export StrictDoc requirements
        run: strictdoc export requirements --output-dir build/requirements
      - name: Archive generated requirements HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-${{ matrix.os }}
          path: build/requirements/
          if-no-files-found: ignore
      - name: Validate 25-instrument porting catalog
        run: python scripts/check_instrument_catalog.py
      - name: Regenerate source into working tree for exact drift diagnosis
        shell: bash
        run: |
          dotnet run --project tools/BenchForge.DriverGen/BenchForge.DriverGen.csproj -- instrument-definitions src/BenchForge/Generated
          dotnet run --project tools/BenchForge.DriverGen/BenchForge.DriverGen.csproj -- --preview-v2 instrument-definitions/drafts generated/BenchForge.Instruments/Code
          git diff --binary -- src/BenchForge/Generated generated/BenchForge.Instruments/Code > generated-drift.patch
          git status --short -- src/BenchForge/Generated generated/BenchForge.Instruments/Code > generated-drift-status.txt
      - name: Archive exact generated-source drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-drift-${{ matrix.os }}
          path: |
            generated-drift.patch
            generated-drift-status.txt
          if-no-files-found: ignore
      - name: Enforce generated-source consistency
        shell: bash
        run: |
          if [ -s generated-drift-status.txt ]; then
            cat generated-drift-status.txt
            echo "Generated source differs from committed source. Download the generated-drift artifact."
            exit 1
          fi
          dotnet run --project tools/BenchForge.DriverGen/BenchForge.DriverGen.csproj -- instrument-definitions src/BenchForge/Generated --check
          dotnet run --project tools/BenchForge.DriverGen/BenchForge.DriverGen.csproj -- --preview-v2 instrument-definitions/drafts generated/BenchForge.Instruments/Code --check
      - name: Test shared virtual bench and stateful signal model
        run: dotnet test tests/BenchForge.Tests/BenchForge.Tests.csproj --configuration Release --filter "FullyQualifiedName~VirtualSignalBusTests|FullyQualifiedName~VirtualBenchTests"
      - name: Test stateful mock engine and IoC composition
        run: dotnet test tests/BenchForge.Tests/BenchForge.Tests.csproj --configuration Release --filter "FullyQualifiedName~StatefulMockEngineTests"
      - name: Test run-scoped stateful mock composition
        run: dotnet test tests/BenchForge.Experiments.Tests/BenchForge.Experiments.Tests.csproj --configuration Release --filter "FullyQualifiedName~StatefulMockCompositionTests"
      - name: Test coherent virtual source and oscilloscope acquisition
        run: dotnet test tests/BenchForge.Tests/BenchForge.Tests.csproj --configuration Release --filter "FullyQualifiedName~VirtualCoherentAcquisitionTests"
      - name: Test run-scoped virtual source and scope composition
        run: dotnet test tests/BenchForge.Experiments.Tests/BenchForge.Experiments.Tests.csproj --configuration Release --filter "FullyQualifiedName~VirtualSmuCompositionTests"
      - name: Compile committed schema-v2 generated preview
        run: dotnet build generated/BenchForge.Instruments/BenchForge.Instruments.csproj --configuration Release
      - name: Archive portable XDoc comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdoc-parity-${{ matrix.os }}
          path: |
            build/docs-preflight.json
            build/docs-parity.json
          if-no-files-found: ignore
      - name: Restore API documentation tooling
        if: runner.os == 'Linux'
        run: dotnet tool restore
      - name: Build Python API reference
        if: runner.os == 'Linux'
        run: |
          python -m venv .tools/docs-venv
          .tools/docs-venv/bin/python -m pip install -r tools/docs-requirements.txt
          .tools/docs-venv/bin/python -m sphinx -W --keep-going -b html docs/python build/python
      - name: Build CSharp API reference
        if: runner.os == 'Linux'
        run: dotnet tool run docfx docfx.json
      - name: Archive API documentation and audit
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: |
            build/documentation/
            build/documentation-audit.json
          if-no-files-found: ignore
      - name: Test local binary captures
        run: dotnet test tests/BenchForge.Artifacts.Tests/BenchForge.Artifacts.Tests.csproj
      - name: Build artifact recovery probe
        run: dotnet build tools/BenchForge.ArtifactCrashProbe
      - name: Verify artifact process-exit recovery
        run: python scripts/check_artifact_recovery.py
      - name: Run tests
        run: dotnet test tests/BenchForge.Tests/BenchForge.Tests.csproj --configuration Release

      - name: Run alpha waveform and RMS integration smoke test
        run: dotnet run --project examples/BenchForge.AlphaDemo/BenchForge.AlphaDemo.csproj --configuration Release
      - name: Archive alpha waveform evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-waveform-${{ matrix.os }}
          path: alpha-demo-output/
          if-no-files-found: ignore
      - name: Run generated typed driver/mock demonstration
        run: dotnet run --project examples/BenchForge.GeneratedMockDemo/BenchForge.GeneratedMockDemo.csproj --configuration Release
      - name: Test experiment-scoped dependency injection
        run: dotnet test tests/BenchForge.Experiments.Tests/BenchForge.Experiments.Tests.csproj --configuration Release
      - name: Run experiment composition demonstration
        run: dotnet run --project examples/BenchForge.ExperimentDemo/BenchForge.ExperimentDemo.csproj --configuration Release
      - name: Run generic UnitsNet meter demonstration
        run: dotnet run --project examples/BenchForge.TypedMockDemo/BenchForge.TypedMockDemo.csproj --configuration Release
      - name: Run AutoMock fluent experiment demonstration
        run: dotnet run --project examples/BenchForge.ExperimentDemo/BenchForge.ExperimentDemo.csproj --configuration Release -- --automock
      - name: Run AutoMock JSON experiment demonstration
        run: dotnet run --project examples/BenchForge.ExperimentDemo/BenchForge.ExperimentDemo.csproj --configuration Release -- --automock-json
      - name: Run Instrument Definer unit tests
        run: python -m unittest discover -s tests/instrument_definer -p 'test_*.py' -v
      - name: Test Starlark mock-backed procedures
        run: dotnet test tests/BenchForge.Procedures.Tests/BenchForge.Procedures.Tests.csproj --configuration Release
      - name: Run mock-backed procedure example
        run: dotnet run --project examples/BenchForge.ProcedureDemo/BenchForge.ProcedureDemo.csproj --configuration Release
      - name: Run Reqnroll executable acceptance scenarios
        run: dotnet test tests/BenchForge.Acceptance.Tests/BenchForge.Acceptance.Tests.csproj --configuration Release
      - name: Build browser test project
        run: dotnet build tests/BenchForge.Browser.Tests/BenchForge.Browser.Tests.csproj --configuration Release
      - name: Install Playwright Chromium
        shell: pwsh
        run: ./tests/BenchForge.Browser.Tests/bin/Release/net11.0/playwright.ps1 install chromium
      - name: Run real-browser unattended monitor tests
        run: dotnet test tests/BenchForge.Browser.Tests/BenchForge.Browser.Tests.csproj --configuration Release --no-build
      - name: Archive browser failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failures-${{ matrix.os }}
          path: TestResults/browser/
          if-no-files-found: ignore
      - name: Test standalone UnitsNet plotting adapter
        run: dotnet test tests/UnitsNet.Plotting.Tests/UnitsNet.Plotting.Tests.csproj --configuration Release

      - name: Run dependency-injection overcurrent demo
        run: dotnet run --project examples/BenchForge.DiDemo/BenchForge.DiDemo.csproj --configuration Release
      - name: Run dependency-injection normal demo
        run: dotnet run --project examples/BenchForge.DiDemo/BenchForge.DiDemo.csproj --configuration Release -- --normal
      - name: Test durable SQLite time-series recorder
        run: dotnet test tests/BenchForge.TimeSeries.Sqlite.Tests/BenchForge.TimeSeries.Sqlite.Tests.csproj --configuration Release

      - name: Run seven-hour thermal-cycle simulation demo
        run: dotnet run --project examples/BenchForge.ThermalCycleDemo/BenchForge.ThermalCycleDemo.csproj --configuration Release
      - name: Build ScottPlot visualization adapter
        run: dotnet build src/BenchForge.Plotting.ScottPlot/BenchForge.Plotting.ScottPlot.csproj --configuration Release

      - name: Build official IVI.NET adapter
        run: dotnet build src/BenchForge.Ivi.Official/BenchForge.Ivi.Official.csproj --configuration Release
      - name: Run official IVI.NET adapter contract tests
        run: dotnet test tests/BenchForge.Ivi.Official.Tests/BenchForge.Ivi.Official.Tests.csproj --configuration Release
      - name: Build instrument host and client
        run: dotnet build src/BenchForge.Host.Server/BenchForge.Host.Server.csproj --configuration Release
      - name: Test instrument-host reservation contracts
        run: dotnet test tests/BenchForge.Host.Tests/BenchForge.Host.Tests.csproj --configuration Release

      - name: Enforce source-neutrality release gate
        if: always()
        shell: pwsh
        run: ./scripts/checks.ps1 -Python python -Command neutrality-strict
