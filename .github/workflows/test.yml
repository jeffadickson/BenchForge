name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SourceRevisionId: ${{ github.sha }}
concurrency:
  group: benchforge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install StrictDoc requirements tracker
        run: python -m pip install -r tools/requirements.txt
      - name: Audit all tracked files for source-neutral naming
        run: python scripts/check_source_neutrality.py --output build/source-neutrality-audit.json
      - name: Archive source-reference audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-reference-audit-${{ matrix.os }}
          path: build/source-neutrality-audit.json
          if-no-files-found: ignore
      - name: Validate requirement IDs and traceability
        run: python scripts/check_requirements.py
      - name: Parse and export StrictDoc requirements
        run: strictdoc export requirements --output-dir build/requirements
      - name: Archive generated requirements HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-${{ matrix.os }}
          path: build/requirements/
          if-no-files-found: ignore
      - name: Validate 25-instrument porting catalog
        run: python scripts/check_instrument_catalog.py
      - name: Regenerate source into working tree for exact drift diagnosis
        shell: bash
        run: |
          dotnet run --project tools/BenchDouble.DriverGen/BenchDouble.DriverGen.csproj -- instrument-definitions src/BenchDouble/Generated
          dotnet run --project tools/BenchDouble.DriverGen/BenchDouble.DriverGen.csproj -- --preview-v2 instrument-definitions/drafts generated/BenchForge.Instruments/Code
          git diff --binary -- src/BenchDouble/Generated generated/BenchForge.Instruments/Code > generated-drift.patch
          git status --short -- src/BenchDouble/Generated generated/BenchForge.Instruments/Code > generated-drift-status.txt
      - name: Archive exact generated-source drift
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-drift-${{ matrix.os }}
          path: |
            generated-drift.patch
            generated-drift-status.txt
          if-no-files-found: ignore
      - name: Enforce generated-source consistency
        shell: bash
        run: |
          if [ -s generated-drift-status.txt ]; then
            cat generated-drift-status.txt
            echo "Generated source differs from committed source. Download the generated-drift artifact."
            exit 1
          fi
          dotnet run --project tools/BenchDouble.DriverGen/BenchDouble.DriverGen.csproj -- instrument-definitions src/BenchDouble/Generated --check
          dotnet run --project tools/BenchDouble.DriverGen/BenchDouble.DriverGen.csproj -- --preview-v2 instrument-definitions/drafts generated/BenchForge.Instruments/Code --check
      - name: Test shared virtual bench and stateful signal model
        run: dotnet test tests/BenchDouble.Tests/BenchDouble.Tests.csproj --configuration Release --filter "FullyQualifiedName~VirtualSignalBusTests|FullyQualifiedName~VirtualBenchTests"
      - name: Compile committed schema-v2 generated preview
        run: dotnet build generated/BenchForge.Instruments/BenchForge.Instruments.csproj --configuration Release
      - name: Audit API documentation
        run: dotnet run --project tools/BenchDouble.DocumentationAudit -- . build/api-audit.json
      - name: Compare portable XDoc preflight with Roslyn
        continue-on-error: true
        run: |
          python scripts/check_docs_portable.py . --output build/docs-preflight.json
          python scripts/compare_doc_audits.py --roslyn build/api-audit.json --portable build/docs-preflight.json --output build/docs-parity.json
      - name: Archive portable XDoc comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdoc-parity-${{ matrix.os }}
          path: |
            build/docs-preflight.json
            build/docs-parity.json
          if-no-files-found: ignore
      - name: Test documentation gate
        run: python -m unittest discover -s tests/documentation -v
      - name: Reject new documentation gaps
        run: python scripts/check_api_docs.py
      - name: Restore API documentation tooling
        if: runner.os == 'Linux'
        run: dotnet tool restore
      - name: Build Python API reference
        if: runner.os == 'Linux'
        run: |
          python -m venv .tools/docs-venv
          .tools/docs-venv/bin/python -m pip install -r tools/docs-requirements.txt
          .tools/docs-venv/bin/python -m sphinx -W --keep-going -b html docs/python build/python
      - name: Build CSharp API reference
        if: runner.os == 'Linux'
        run: dotnet tool run docfx docfx.json
      - name: Archive API documentation and audit
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: |
            build/documentation/
            build/documentation-audit.json
          if-no-files-found: ignore
      - name: Test local binary captures
        run: dotnet test tests/BenchDouble.Artifacts.Tests/BenchDouble.Artifacts.Tests.csproj
      - name: Build artifact recovery probe
        run: dotnet build tools/BenchDouble.ArtifactCrashProbe
      - name: Verify artifact process-exit recovery
        run: python scripts/check_artifact_recovery.py
      - name: Run tests
        run: dotnet test tests/BenchDouble.Tests/BenchDouble.Tests.csproj --configuration Release

      - name: Run alpha waveform and RMS integration smoke test
        run: dotnet run --project examples/BenchForge.AlphaDemo/BenchForge.AlphaDemo.csproj --configuration Release
      - name: Archive alpha waveform evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-waveform-${{ matrix.os }}
          path: alpha-demo-output/
          if-no-files-found: ignore
      - name: Run generated typed driver/mock demonstration
        run: dotnet run --project examples/BenchDouble.GeneratedMockDemo/BenchDouble.GeneratedMockDemo.csproj --configuration Release
      - name: Test experiment-scoped dependency injection
        run: dotnet test tests/BenchDouble.Experiments.Tests/BenchDouble.Experiments.Tests.csproj --configuration Release
      - name: Run experiment composition demonstration
        run: dotnet run --project examples/BenchDouble.ExperimentDemo/BenchDouble.ExperimentDemo.csproj --configuration Release
      - name: Run generic UnitsNet meter demonstration
        run: dotnet run --project examples/BenchDouble.TypedMockDemo/BenchDouble.TypedMockDemo.csproj --configuration Release
      - name: Run AutoMock fluent experiment demonstration
        run: dotnet run --project examples/BenchDouble.ExperimentDemo/BenchDouble.ExperimentDemo.csproj --configuration Release -- --automock
      - name: Run AutoMock JSON experiment demonstration
        run: dotnet run --project examples/BenchDouble.ExperimentDemo/BenchDouble.ExperimentDemo.csproj --configuration Release -- --automock-json
      - name: Test Parlot mock-backed procedures
        run: dotnet test tests/BenchDouble.Procedures.Tests/BenchDouble.Procedures.Tests.csproj --configuration Release
      - name: Run mock-backed procedure example
        run: dotnet run --project examples/BenchDouble.ProcedureDemo/BenchDouble.ProcedureDemo.csproj --configuration Release
      - name: Run Reqnroll executable acceptance scenarios
        run: dotnet test tests/BenchDouble.Acceptance.Tests/BenchDouble.Acceptance.Tests.csproj --configuration Release
      - name: Build browser test project
        run: dotnet build tests/BenchDouble.Browser.Tests/BenchDouble.Browser.Tests.csproj --configuration Release
      - name: Install Playwright Chromium
        shell: pwsh
        run: ./tests/BenchDouble.Browser.Tests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Run real-browser unattended monitor tests
        run: dotnet test tests/BenchDouble.Browser.Tests/BenchDouble.Browser.Tests.csproj --configuration Release --no-build
      - name: Archive browser failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failures-${{ matrix.os }}
          path: TestResults/browser/
          if-no-files-found: ignore
      - name: Test standalone UnitsNet plotting adapter
        run: dotnet test tests/UnitsNet.Plotting.Tests/UnitsNet.Plotting.Tests.csproj --configuration Release

      - name: Run dependency-injection overcurrent demo
        run: dotnet run --project examples/BenchDouble.DiDemo/BenchDouble.DiDemo.csproj --configuration Release
      - name: Run dependency-injection normal demo
        run: dotnet run --project examples/BenchDouble.DiDemo/BenchDouble.DiDemo.csproj --configuration Release -- --normal
      - name: Test durable SQLite time-series recorder
        run: dotnet test tests/BenchDouble.TimeSeries.Sqlite.Tests/BenchDouble.TimeSeries.Sqlite.Tests.csproj --configuration Release

      - name: Run seven-hour thermal-cycle simulation demo
        run: dotnet run --project examples/BenchDouble.ThermalCycleDemo/BenchDouble.ThermalCycleDemo.csproj --configuration Release
      - name: Build ScottPlot visualization adapter
        run: dotnet build src/BenchDouble.Plotting.ScottPlot/BenchDouble.Plotting.ScottPlot.csproj --configuration Release

      - name: Build official IVI.NET adapter
        run: dotnet build src/BenchDouble.Ivi.Official/BenchDouble.Ivi.Official.csproj --configuration Release
      - name: Run official IVI.NET adapter contract tests
        run: dotnet test tests/BenchDouble.Ivi.Official.Tests/BenchDouble.Ivi.Official.Tests.csproj --configuration Release
      - name: Build instrument host and client
        run: dotnet build src/BenchDouble.Host.Server/BenchDouble.Host.Server.csproj --configuration Release
      - name: Test instrument-host reservation contracts
        run: dotnet test tests/BenchDouble.Host.Tests/BenchDouble.Host.Tests.csproj --configuration Release

      - name: Enforce source-neutrality release gate
        if: always()
        run: python scripts/check_source_neutrality.py --strict --output build/source-neutrality-audit.json
